name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:audio
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm exec prettier --check .
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 1

  server:
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: server/go.mod
      # The binary embeds the client, so stage the build before compiling.
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: server/internal/webui/assets
      - name: gofmt
        working-directory: server
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi
      - working-directory: server
        run: go vet ./...
      - working-directory: server
        run: go test ./...
      - working-directory: server
        run: go test -race ./...
      - working-directory: server
        run: go mod tidy -diff
      - working-directory: server
        run: CGO_ENABLED=0 go build -trimpath -o /tmp/rhythm ./cmd/rhythm

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag rhythm:ci .
